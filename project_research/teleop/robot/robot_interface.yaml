robot_model:
  name: divided_robot
  url: 'simplehand.body'

# mobile_base:
#   type: geometry_msgs/Twist
#   topic: /divided_robot/cmd_vel
#   baselink: Root

joint_groups:
  -
    name: default
    topic: /divided_robot/trajectory_controller/command
    # type: 'action' or 'command'
    type: command
    joint_names: ['LINK_0', 'LINK_1', 'LINK_2', 'LINK_3', 'LINK_4', 'LINK_5']
  -
    name: default
    topic: /divided_robot/gripper_controller/command
    # type: 'action' or 'command'
    type: command
    joint_names: ['LINK_6']
devices:
  -
    topic: /divided_robot/joint_states
    class: JointState
    name: joint_state
  -
    topic: /divided_robot/trajectory_controller/state
    class: JointTrajectoryState
    name: joint_trajectory_state
